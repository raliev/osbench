[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osbench"
version = "0.1.0"
description = "Order-sourcing benchmark: discrete-event simulator for e-commerce warehouse selection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rauf" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "plotly>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "msgspec>=0.18",
    "orjson>=3.10",
]

[project.optional-dependencies]
accel = ["numba>=0.60", "scipy>=1.13"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
osbench = "osbench.cli.main:app"

# Policy plugin registry: adding a policy = one file + one line here.
[project.entry-points."osbench.policies.sourcing"]
random = "osbench.policies.sourcing.random_policy:RandomPolicy"
nearest = "osbench.policies.sourcing.nearest_policy:NearestPolicy"
cheapest_myopic = "osbench.policies.sourcing.cheapest_myopic_policy:CheapestMyopicPolicy"
weighted_score = "osbench.policies.sourcing.weighted_score_policy:WeightedScorePolicy"
weighted_score_tuned = "osbench.policies.sourcing.weighted_score_tuned_policy:WeightedScoreTunedPolicy"
dtlp_bidprice = "osbench.policies.sourcing.dtlp_bidprice_policy:DTLPBidPricePolicy"
primal_dual = "osbench.policies.sourcing.primal_dual_policy:PrimalDualPolicy"
hindsight_lp = "osbench.policies.sourcing.hindsight_lp_policy:HindsightLPPolicy"
spillover_limit = "osbench.policies.sourcing.spillover_limit_policy:SpilloverLimitPolicy"
rolling_milp = "osbench.policies.sourcing.rolling_milp_policy:RollingMILPPolicy"
broken_wh0 = "osbench.policies.sourcing._demo:BrokenWh0Policy"

[project.entry-points."osbench.policies.transfer"]
none = "osbench.policies.transfer.none_policy:NoneTransferPolicy"
threshold_balance = "osbench.policies.transfer.threshold_balance_policy:ThresholdBalancePolicy"
pull_base_stock = "osbench.policies.transfer.pull_base_stock_policy:PullBaseStockPolicy"

[project.entry-points."osbench.policies.replenishment"]
base_stock = "osbench.policies.replenishment.base_stock_policy:BaseStockPolicy"
s_S = "osbench.policies.replenishment.s_S_policy:SsSPolicy"
R_Q = "osbench.policies.replenishment.R_Q_policy:RQPolicy"
forecast_driven = "osbench.policies.replenishment.forecast_driven_policy:ForecastDrivenPolicy"
network_allocation = "osbench.policies.replenishment.network_allocation_policy:NetworkAllocationPolicy"

[tool.setuptools.packages.find]
where = ["."]
include = ["osbench*"]

[tool.setuptools.package-data]
"osbench.config" = ["presets/*.yaml"]
"osbench.live" = ["static/*"]
"osbench.replay" = ["static/*"]
"osbench.studio" = ["static/*"]

[tool.pytest.ini_options]
markers = [
    "fast: fast unit tests (every commit, tiny/small)",
    "nightly: slow tests (golden, plausibility)",
]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
