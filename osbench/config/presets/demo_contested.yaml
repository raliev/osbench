# demo_contested — small, built for visualization and demos.
#
# CASE: customers sit in a band *between* two warehouses, so which warehouse is
# nearest (and cheapest) flips depending on where exactly the customer lands.
# W0 is at x=300, W1 at x=700; the customer cloud is centered on x=500 and spread
# wide enough (region_radius_km) to straddle the x=500 divide. Orders left of the
# midline should be sourced from W0, orders to the right from W1 — a crisp, legible
# split you can see on the inspector map.
#
# WHY SEPARATE: it is the cleanest demonstration of distance/cost-driven sourcing.
# Baskets are kept to ~1 line and stock is ample (cover 30 days) so every order is a
# single point with one obvious chosen warehouse — nothing else muddies the picture.
name: demo_contested
description: "Customers sit in a band between two warehouses so the cheaper/nearer warehouse flips across the midline. Use the inspector's 'color by warehouse' to see the dividing line. Isolates the pure distance/price trade-off with no scarcity."
sim_days: 45
warmup_days: 7
geo: { mode: plane, plane_size: 1000.0 }
region_radius_km: 150.0            # wide cloud so customers straddle the W0/W1 divide
regions:
  # Three regions along the horizontal axis between the two warehouses; the center
  # one carries the most demand and overlaps both warehouses' catchment areas.
  - { region_id: 0, name: Left,   x: 360.0, y: 500.0, population_weight: 0.8 }
  - { region_id: 1, name: Center, x: 500.0, y: 500.0, population_weight: 1.6 }
  - { region_id: 2, name: Right,  x: 640.0, y: 500.0, population_weight: 0.8 }
warehouses:
  - { warehouse_id: 0, name: W0, x: 300.0, y: 500.0, capacity_lines_per_day: 400, rank: 0.6 }
  - { warehouse_id: 1, name: W1, x: 700.0, y: 500.0, capacity_lines_per_day: 400, rank: 0.6 }
tariffs:
  zone_bounds_km: [50.0, 300.0, 1000.0, 1000000000.0]
  cost_by_zone: [3.0, 5.0, 7.0, 10.0]
  per_kg_by_zone: [0.1, 0.2, 0.3, 0.5]
  transit_days_by_zone: [1, 2, 4, 7]
sku:
  n_sku: 60
  zipf_a: 1.1
  n_categories: 3
suppliers:
  - { supplier_id: 0, name: S0, unit_price: 10.0, moq: 20, lead_time_days: 5, capacity_per_period: 200000 }
demand:
  base_orders_per_day: 100
  lines_per_order_mean: 1.2         # near single-item: one point = one clear decision
  qty_max: 2
promise: { method: transit_plus_buffer, buffer_days: 1, min_processing_days: 1, cap_days: 10 }
deferral: { mode: none }
initial_cover_days: 30             # ample stock: sourcing follows cheapest, not scarcity
