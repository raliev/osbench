name: small
description: "Standard small preset (5 regions, 4 warehouses, ~500 SKUs). The golden-run and sanity-check workhorse for fast policy comparisons."
sim_days: 90
warmup_days: 14
geo: { mode: plane, plane_size: 1000.0 }
region_radius_km: 20.0
regions:
  - { region_id: 0, name: R0, x: 100.0, y: 100.0, population_weight: 1.0 }
  - { region_id: 1, name: R1, x: 900.0, y: 100.0, population_weight: 0.8 }
  - { region_id: 2, name: R2, x: 100.0, y: 900.0, population_weight: 0.6 }
  - { region_id: 3, name: R3, x: 900.0, y: 900.0, population_weight: 0.5 }
  - { region_id: 4, name: R4, x: 500.0, y: 500.0, population_weight: 1.2 }
warehouses:
  - { warehouse_id: 0, name: W0, x: 200.0, y: 200.0, capacity_lines_per_day: 500, rank: 0.8 }
  - { warehouse_id: 1, name: W1, x: 800.0, y: 200.0, capacity_lines_per_day: 500, rank: 0.6 }
  - { warehouse_id: 2, name: W2, x: 200.0, y: 800.0, capacity_lines_per_day: 400, rank: 0.5 }
  - { warehouse_id: 3, name: W3, x: 800.0, y: 800.0, capacity_lines_per_day: 400, rank: 0.5 }
tariffs:
  zone_bounds_km: [50.0, 300.0, 1000.0, 1000000000.0]
  cost_by_zone: [3.0, 5.0, 7.0, 10.0]
  per_kg_by_zone: [0.1, 0.2, 0.3, 0.5]
  transit_days_by_zone: [1, 2, 4, 7]
sku:
  n_sku: 500
  zipf_a: 1.1
  n_categories: 5
suppliers:
  - { supplier_id: 0, name: S0, unit_price: 10.0, moq: 50, lead_time_days: 7, capacity_per_period: 500000 }
  - { supplier_id: 1, name: S1, unit_price: 11.5, moq: 1, lead_time_days: 4, capacity_per_period: 200000 }
  - { supplier_id: 2, name: S2, unit_price: 13.0, moq: 1, lead_time_days: 2, capacity_per_period: 100000 }
demand:
  base_orders_per_day: 200
  lines_per_order_mean: 1.6
promise: { method: transit_plus_buffer, buffer_days: 2, min_processing_days: 1, cap_days: 10 }
deferral: { mode: none }
initial_cover_days: 14
