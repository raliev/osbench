# demo_stranded — a scarcity scenario where ATP tolerance creates stranded stock, so the
# sourcing allocation drives lost sales (a different win mechanism than demo_showcase).
#
# THE TENSION: three warehouses on a line. The central warehouse WC (id 0) is the cheapest
# option for the central "Big" region AND is tie-cheapest for the two side regions. With ATP
# tolerance ON, the Big region can ONLY be served from WC (the side warehouses are out of
# price tolerance for it) — it is captive. Inventory is tight and replenishment lags. A myopic
# policy breaks ties toward WC and burns its stock on the side regions (which also have local
# warehouses), so the captive Big region is left with no reachable stock and its orders are
# LOST — even though the side warehouses still hold stock (it is stranded). A stock-aware
# policy (weighted_score, via above_safety) preserves WC for the captive region and routes the
# side regions to their local warehouses, cutting lost sales and total cost.
#
# Use it to show weighted_score / stock-aware policies beating cheapest_myopic / nearest under
# scarcity + tolerance. NOTE (honest): our simplified dtlp_bidprice does NOT beat weighted here
# — its periodic forecast is not sharper than weighted's real-time stock signal (this is RQ1).
name: demo_stranded
description: "Scarcity + ATP tolerance: a captive central region can only be served from the central warehouse. A myopic policy drains it on the side regions and strands stock, losing captive sales; a stock-aware policy preserves it. Shows weighted_score beating cheapest/nearest via avoided stranded-stock lost sales."
sim_days: 45
warmup_days: 7
geo: { mode: plane, plane_size: 1000.0 }
region_radius_km: 25.0
regions:
  - { region_id: 0, name: Big,  x: 500.0, y: 500.0, population_weight: 1.4 }   # captive to WC
  - { region_id: 1, name: West, x: 400.0, y: 500.0, population_weight: 1.0 }
  - { region_id: 2, name: East, x: 600.0, y: 500.0, population_weight: 1.0 }
warehouses:
  # WC is id 0 so ties break toward it (greedy funnels into WC and drains it).
  - { warehouse_id: 0, name: WC, x: 500.0, y: 500.0, capacity_lines_per_day: 100000, rank: 0.5 }
  - { warehouse_id: 1, name: WL, x: 300.0, y: 500.0, capacity_lines_per_day: 100000, rank: 0.5 }
  - { warehouse_id: 2, name: WR, x: 700.0, y: 500.0, capacity_lines_per_day: 100000, rank: 0.5 }
tariffs:
  zone_bounds_km: [50.0, 300.0, 1000.0, 1000000000.0]
  cost_by_zone: [3.0, 5.0, 9.0, 14.0]
  per_kg_by_zone: [0.1, 0.2, 0.4, 0.7]
  transit_days_by_zone: [1, 2, 4, 7]
sku:
  n_sku: 120
  zipf_a: 1.2
  n_categories: 4
suppliers:
  - { supplier_id: 0, name: S0, unit_price: 10.0, moq: 20, lead_time_days: 7, capacity_per_period: 300000 }
demand:
  base_orders_per_day: 300
  lines_per_order_mean: 1.3
  qty_max: 2
atp:
  tolerance_enabled: true          # the key switch: distant stock becomes unreachable -> stranding
  tolerance_price_frac: 0.4
  tolerance_days: 3
shortage:
  penalty_late_per_day: 0.0        # isolate the inventory effect (no capacity/lateness tension)
  penalty_lost_sale: 20.0          # a lost captive sale is expensive -> preserving WC pays off
promise: { method: transit_plus_buffer, buffer_days: 1, min_processing_days: 1, cap_days: 10 }
initial_cover_days: 14
